name: API CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_saas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_saas_test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_saas_shadow
      JWT_ACCESS_SECRET: test_access_secret_minimum_32_characters
      PASSWORD_PEPPER_KEY_ID: ci-pepper
      PASSWORD_PEPPER: test_password_pepper_minimum_32_chars
      TOKEN_HASH_SECRET: test_token_hash_secret_minimum_32_chars
      REFRESH_IDEMPOTENCY_SECRET: test_refresh_idempotency_secret_minimum_32_chars
      EMAIL_OUTBOX_ENCRYPTION_KEY_ID: ci-key
      EMAIL_OUTBOX_ENCRYPTION_KEY: test_email_outbox_encryption_key_minimum_32_chars
      EMAIL_OUTBOX_ENCRYPTION_KEYS: '{"ci-key":"test_email_outbox_encryption_key_minimum_32_chars"}'
      CSRF_SECRET: test_csrf_secret_minimum_32_characters
      EXPOSE_AUTH_TOKENS: "true"
      RUN_DB_TESTS: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci
      - run: npm run audit:ci
      - name: Full dependency audit visibility
        run: npm run audit:full
        continue-on-error: true
      - run: psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE erp_saas_shadow;"
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run tenant:preflight
      - run: npm run email:outbox:encrypt-legacy
      - run: npm run email:outbox:rotate-key
      - run: npx prisma validate
      - run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      - run: npm test
      - run: npm run test:integration:db
      - run: npm run build
