version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      api-security:
        patterns:
          - "@fastify/*"
          - "fastify"
          - "hono"
          - "@hono/*"
